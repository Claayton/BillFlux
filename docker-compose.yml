# Desenvolvimento: API com SQLite + nginx servindo o SPA (porta 80 local).
# Para produção (PostgreSQL + Traefik), use: docker compose -f docker-compose-prod.yml up -d
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      BILLFLUX_DATABASE__URL: sqlite:///data/billflux.db
      BILLFLUX_SECRET_KEY: ${BILLFLUX_SECRET_KEY:-change-me}
      BILLFLUX_AUTH__ALLOW_SIGNUP: ${BILLFLUX_AUTH__ALLOW_SIGNUP:-true}
      BILLFLUX_AUTH__USERNAME: ${BILLFLUX_AUTH__USERNAME:-admin}
      BILLFLUX_AUTH__PASSWORD_HASH: ${BILLFLUX_AUTH__PASSWORD_HASH:-}
    volumes:
      - billflux-data:/app/data
    expose:
      - "5000"

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "80:80"
    depends_on:
      - api

volumes:
  billflux-data:
