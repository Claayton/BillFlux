{% extends 'base.html' %}

{% block title %}{{ super() }} - Vendas{% endblock %}

{% block content %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/sales.css') }}?v=5">

<div class="dashboard">
  <div class="page-header">
    <div>
      <h1 class="page-title">Vendas</h1>
      <p class="page-subtitle">Vendas avulsas e pedidos fechados no PDV.</p>
    </div>
  </div>
  {% include '_sales_region.html' %}
</div>

<!-- Modal: editar venda do dia -->
<div id="sale-modal" class="modal">
  <div class="modal-content modal-content-sm">
    <div class="modal-header">
      <h2>Editar venda do dia</h2>
      <button class="modal-close" aria-label="Fechar">&times;</button>
    </div>
    <form id="sale-edit-form" action="/sales" method="POST" class="modal-form"
          hx-post="/sales" hx-target="#sales-region" hx-swap="outerHTML"
          hx-on::after-request="closeSaleModal(event)">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="form-field">
        <label for="edit_sale_date">Data</label>
        <input type="date" id="edit_sale_date" name="date" required>
      </div>

      <div class="form-field">
        <label for="edit_sale_total">Total bruto</label>
        <input type="text" id="edit_sale_total" name="total" placeholder="R$ 0,00" inputmode="decimal" required>
      </div>

      <div class="form-field">
        <label for="edit_sale_obs">Observações (opcional)</label>
        <input type="text" id="edit_sale_obs" name="obs" placeholder="Ex: feira, balcão...">
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-ghost modal-cancel">Cancelar</button>
        <button type="submit" class="btn btn-primary">Salvar venda</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/sales.js') }}?v=3"></script>
{% endblock %}
