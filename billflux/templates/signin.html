{% extends 'base.html' %}

{% block title %}{{ super() }} - Criar conta{% endblock %}

{% block content %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/style-home.css') }}">

<section class="auth-page">
  <div class="auth-card">
    <div class="auth-header">
      <span class="logo-mark">BF</span>
      <h2>Criar sua conta</h2>
      <p>Comece a organizar suas contas a pagar.</p>
    </div>

    <form method="POST" action="{{ url_for('bp_auth.signin') }}" class="auth-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="form-field">
        <label for="username">Nome de usuário</label>
        <input type="text" id="username" name="username" placeholder="seu_usuario" required>
      </div>

      <div class="form-field">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" placeholder="voce@exemplo.com" required>
      </div>

      <div class="form-field">
        <label for="password">Senha</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn btn-primary btn-block">Criar conta</button>
    </form>

    <p class="auth-footer">
      Já tem conta?
      <a href="{{ url_for('bp_auth.login') }}">Entrar</a>
    </p>
  </div>
</section>
{% endblock %}
