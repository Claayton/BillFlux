<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Ponto de venda BillFlux.">
  <meta name="author" content="Clayton Garcia da Silva">
  <title>{% block title %}BillFlux{% endblock %}</title>
  <link rel="icon" href="{{ url_for('static', filename='img/favicon.ico') }}" sizes="any">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style-base.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/pdv.css') }}">
  <script src="https://kit.fontawesome.com/c996c5ea01.js" crossorigin="anonymous"></script>
</head>
<body class="pdv-screen">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      <div class="flash-stack" role="alert">
        {% for category, message in messages %}
          <div class="flash flash-{{ category }}">
            <span>{{ message }}</span>
            <button class="flash-close" aria-label="Fechar">&times;</button>
          </div>
        {% endfor %}
      </div>
    {% endif %}
  {% endwith %}

  {% block content %}{% endblock %}

  <script>
    document.querySelectorAll('.flash-close').forEach(function (btn) {
      btn.addEventListener('click', function () {
        btn.parentElement.remove();
      });
    });
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
